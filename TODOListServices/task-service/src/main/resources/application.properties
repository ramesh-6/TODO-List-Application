# =========================
# Server Configuration
# =========================
server.port=8081
spring.application.name=task-service

# =========================
# MySQL Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/taskservice
spring.datasource.username=root
spring.datasource.password=mkrk7500
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# H2 Console
# =========================
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-ui

# =========================
# Logging Configuration
# =========================
logging.level.root=INFO
logging.level.taskService=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =========================
# Actuator & Prometheus Monitoring
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# =========================
# Info Endpoint
# =========================
info.app.name=taskService
info.app.description=Handles task management
