# =========================
# Server Configuration
# =========================
server:
  port: 8083

spring:
  application:
    name: cloud-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      # Global filter adds security token header on all outgoing requests via gateway
      default-filters:
        - name: AddRequestHeader
          args:
            name: X-Request-Token
            value: ${gateway.secret}

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      discovery:
        locator:
          enabled: true

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**, /users/**
          filters:
            - name: JwtAuthFilter

        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/task/**, /tasks/**
          filters:
            - name: JwtAuthFilter

# ====================================================
# Secret key internal authorization via custom headers
# ====================================================
gateway:
  secret: hdsgaf8iouqkjgsdjkjasgd

# ===========================
# Eureka Client Configuration
# ===========================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

# =========================
# Logging Configuration
# =========================
logging:
  level:
    org.springframework.cloud.gateway: INFO
