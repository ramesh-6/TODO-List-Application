server:
  port: 0

spring:
  application:
    name: cloud-gateway
  main:
    web-application-type: reactive
  cloud:
    discovery:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:${wiremock.server.port}
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: http://localhost:${wiremock.server.port}
          predicates:
            - Path=/user/**, /users/**
          filters:
            - name: JwtAuthFilter
        - id: task-service
          uri: http://localhost:${wiremock.server.port}
          predicates:
            - Path=/task/**, /tasks/**
          filters:
            - name: JwtAuthFilter

gateway:
  secret: test-secret-123

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
